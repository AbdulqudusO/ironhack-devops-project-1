---
- name: Rotate PostgreSQL password
  hosts: db
  become: true

  vars_prompt:
    - name: new_db_password
      prompt: "Enter NEW PostgreSQL password"
      private: true

  tasks:
    - name: Change postgres user password
      community.docker.docker_container_exec:
        container: db
        command: >
          psql -U postgres -d postgres
          -c "ALTER USER postgres WITH PASSWORD '{{ new_db_password }}';"
      no_log: true
